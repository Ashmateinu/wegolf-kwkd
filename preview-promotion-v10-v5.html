:root{
 --orange:#EB521A; --orange-press:#EB521A; --orange-text:#EB521A; --green:#053331; --gold:#C6A15B;
 --ink:#040000; --ink-2:#4A4743; --ink-3:#7A766F; --hair:#E6E3DD; --canvas:#F4F3F0; --card:#FFFFFF;
 --m:24px; --g:16px; --pw:min(100vw,430px); --col:calc((var(--pw) - 2*var(--m) - 3*var(--g))/4);
 --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
 --t-cap:12px; --l-cap:16px; --t-body:15px; --l-body:24px; --t-title:20px; --l-title:28px; --t-head:32px; --l-head:40px; --t-score:112px;
 --skew:-9.73deg;
 --zh:"WG Sans","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
 --num:"WG Num","Barlow Condensed","WG Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{overflow-x:clip;font:400 var(--t-body)/var(--l-body) var(--zh);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic{width:24px;height:24px;flex:none}
.n{font-family:var(--num);font-weight:600;display:inline-block;transform:skewX(var(--skew));letter-spacing:0;font-size:inherit;line-height:inherit}
.page{max-width:430px;margin:0 auto;position:relative;padding-left:max(var(--m),var(--sal));padding-right:max(var(--m),var(--sar))}
.top{position:fixed;left:0;right:0;top:0;z-index:20;margin:0 auto;max-width:430px;display:flex;align-items:center;
 height:calc(56px + var(--sat));
 padding:var(--sat) max(calc(var(--m) - 8px),var(--sar)) 0 max(calc(var(--m) - 8px),var(--sal));
 background:rgba(244,243,240,.92);backdrop-filter:blur(8px)}
.top .logo{height:24px;display:block;margin-left:8px}
.top .sp{flex:1}
.icbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--ink)}
.icbtn:active{background:rgba(4,0,0,.06)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
.scr{min-height:100vh;min-height:100svh;min-height:100dvh;padding-top:calc(56px + var(--sat));padding-bottom:var(--sab);display:flex;flex-direction:column}
.stage{position:relative;padding-top:16px;flex:1;display:flex;flex-direction:column;padding-bottom:0}
.kicker{font-size:var(--t-cap);line-height:var(--l-cap);color:var(--ink-3);letter-spacing:.02em}
.cheer{font-size:var(--t-head);line-height:var(--l-head);font-weight:700;letter-spacing:-.01em;margin-top:8px;transform-origin:0 50%}
.cheer2{font-size:var(--t-body);line-height:var(--l-body);color:var(--ink-2);margin-top:4px}
.score{position:relative;display:grid;grid-template-columns:calc(2*var(--col) + var(--g)) 1fr;column-gap:var(--g);align-items:end;margin-top:24px;height:112px}
.rays{position:absolute;left:calc(var(--col) + var(--g)/2);top:64px;width:400px;height:400px;margin:-200px 0 0 -200px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(235,82,26,.09) 0 6deg,transparent 6deg 22.5deg);
  -webkit-mask:radial-gradient(circle,#000 14%,transparent 58%);mask:radial-gradient(circle,#000 14%,transparent 58%);pointer-events:none;z-index:0;opacity:0}
.score>*:not(.rays){position:relative;z-index:1}
.num-wrap{display:block;transform:skewX(var(--skew));transform-origin:0 100%;line-height:.8}
#num{display:inline-block;font:600 var(--t-score)/.8 var(--num);color:var(--orange);letter-spacing:-.02em;font-variant-numeric:tabular-nums;transform-origin:30% 70%}
.meta{padding-bottom:4px;min-width:0}
.meta .lab{font-size:var(--t-cap);line-height:var(--l-cap);color:var(--ink-3)}
.meta .acc{font-size:var(--t-body);line-height:var(--l-body);margin-top:8px}
.meta .acc b{font:600 var(--t-title)/var(--l-body) var(--num);letter-spacing:.01em}
.tier{position:relative;margin-top:40px;height:56px}
.tier .tr{position:absolute;left:0;right:0;top:28px;height:4px;border-radius:2px;background:var(--hair)}
.tier .fill{position:absolute;left:0;top:28px;height:4px;border-radius:2px;background:var(--orange);width:0}
.tier .me{position:absolute;top:24px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:3px solid var(--orange);opacity:0}
.fm{position:absolute;top:0;width:18px;margin-left:-1px;transform-origin:1px 28px;color:#C9C4BA}
.fm .pole{position:absolute;left:0;top:2px;width:2px;height:26px;border-radius:1px;background:currentColor}
.fm .flg{position:absolute;left:1px;top:2px;width:13.484px;height:10.412px;overflow:visible}
.fm .flg path{fill:currentColor}
.fm .lb{position:absolute;left:1px;top:40px;transform:translateX(-50%);white-space:normal;text-align:center;width:max-content;max-width:112px;font-size:var(--t-cap);line-height:var(--l-cap);color:var(--ink-3)}
.fm.on{color:var(--orange)} .fm.on .lb{color:var(--orange-text);font-weight:700}
.fm.gbti{color:var(--green)} .fm.gbti .flg path{fill:none;stroke:var(--green);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.fm.gbti .lb{color:var(--green)}
.fm.gbti.on{color:var(--orange)} .fm.gbti.on .lb{color:var(--orange-text)}
.fm.gbti.on .flg path{fill:currentColor;stroke:none}
.status{margin-top:24px}
.gbti{font-size:var(--t-body);line-height:var(--l-body);font-weight:700;color:var(--green)}
.giftline{font-size:var(--t-cap);line-height:var(--l-cap);color:var(--ink-3);margin-top:8px}
/* 海报式权益块：与庆祝页 gcard/pcard 同一框、同一原比例（height:auto，不裁切）。领取叠在海报上，与已领取同位置同尺寸；页底晋级/继续仍是主按钮 */
.poster{opacity:0;margin-top:16px;background:var(--card);border-radius:20px;padding:16px;display:grid;grid-template-columns:calc(2*var(--col) + var(--g) - 16px) 1fr;column-gap:var(--g);align-items:center}
.poster .pic{position:relative;min-width:0}
.poster .pcard{background:#fff;padding:5px;border-radius:14px 3px 14px 3px;box-shadow:0 2px 6px rgba(4,0,0,.10),0 8px 20px rgba(4,0,0,.08);transform-origin:50% 100%}
.poster .pcard img{display:block;width:100%;height:auto;border-radius:0}
.poster.locked .pcard img{filter:grayscale(1);opacity:.5}
.poster .mark{position:absolute;left:5px;right:5px;bottom:5px;height:24px;display:none;align-items:center;justify-content:center;font-size:var(--t-cap);line-height:var(--l-cap);font-weight:700;letter-spacing:.04em;color:#fff;background:rgba(5,51,49,.88)}
.poster.claimed .mark,.poster.locked .mark,.poster.claimable .mark{display:flex}
.poster.claimed .mark{background:rgba(235,82,26,.92)}
.poster.claimable .mark{background:#EB521A;cursor:pointer}
.poster.claimable .mark:active{background:rgba(235,82,26,.86)}

<script>/* v5 · 共享存储 WGStore（v41 本地键；仅方案或原型） */
(function(){
var IDS=["xiaoxueseng","baizhan","gbti"],COST=[0,18,36];
function gj(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v}catch(e){return d}}
function gi(k,d){try{var v=parseInt(localStorage.getItem(k),10);return isNaN(v)?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,typeof v==="string"?v:JSON.stringify(v))}catch(e){}}
function hist(){var h=gj("wq_hist_v1",{});if(!h||typeof h!=="object"||Array.isArray(h))h={};if(!Array.isArray(h.sessions))h.sessions=[];return h}
function done(){return hist().sessions.filter(function(s){return s&&s.done&&(!s.mode||s.mode==="quick")})}
var W={
  pts:function(){return Math.max(0,gi("wq_pts",0))},
  stage:function(){var s=gi("wq_stage_v44",1);return s>=1&&s<=3?s:1},
  games:function(){return Math.min(3,done().length)},
  used:function(){return Math.min(3,Math.max(0,gi("wq_retakes_used",0)))},
  claims:function(){var r=gj("wq_claim_v2",{})||{};return IDS.filter(function(id){return !!r[id]})},
  /* 每局打完：写总分、下一局档位、对局记录（v41 sessions 结构 + ok/correct/stage） */
  recordRound:function(run){var h=hist(),ts=Date.now();
    h.sessions.push({id:ts+"-"+Math.floor(Math.random()*9999),mode:"quick",ts:ts,q:18,done:1,me:run.roundPts||0,ok:run.correct||0,correct:run.correct||0,stage:run.stage||1,nextStage:run.nextStage||run.stage||1});
    if(h.sessions.length>200)h.sessions=h.sessions.slice(-200);
    sv("wq_hist_v1",h);sv("wq_pts",String(run.pts||0));sv("wq_stage_v44",String(run.nextStage||run.stage||1));},
  /* v41 重开规则：3 局打完才可重开；满 99 不重开；第 1 次免费清零，第 2 次扣 18，第 3 次扣 36；已领赠品保留 */
  retakeInfo:function(){var used=W.used(),pts=W.pts(),games=W.games(),cost=COST[Math.min(used,2)];
    if(used>=3)return{ok:false,why:"done",used:used};
    if(pts>=99)return{ok:false,why:"99",used:used};
    if(games<3)return{ok:false,why:"wait",used:used};
    if(used>0&&pts<cost)return{ok:false,why:"low",cost:cost,used:used};
    return{ok:true,cost:cost,used:used,after:used===0?0:pts-cost,left:3-used}},
  doRetake:function(){var r=W.retakeInfo();if(!r.ok)return false;var h=hist();h.sessions=[];
    sv("wq_hist_v1",h);sv("wq_pts",String(r.after));sv("wq_stage_v44","1");sv("wq_retakes_used",String(r.used+1));return r}
};
window.WGStore=W;
})();
</script>

function gapText(total){var r=Math.max(0,99-total);return r<=0?T("gapDone"):T("gap").replace("{n}",r)}

function breakProd(s){
  s=String(s==null?"":s);
  if(s==="高尔夫小白避坑指南") return '<span class="nw">高尔夫小白</span><span class="nw">避坑指南</span>';
  return s;
}

function topTier(total){return total>=99?"gbti":total>=72?"baizhan":total>=36?"xiaoxueseng":null}
function offerOf(){
  var t=topTier(S.total), claimed=S.claimed||[];
  if(!t) return {id:"xiaoxueseng", mode:"locked", need:Math.max(0,36-S.total), min:36};
  if(claimed.indexOf(t)>=0) return {id:t, mode:"claimed", need:0, min:(t==="gbti"?99:t==="baizhan"?72:36)};
  return {id:t, mode:"claimable", need:0, min:(t==="gbti"?99:t==="baizhan"?72:36)};
}
function giftText(){
  var parts=[], o=offerOf();
  if(S.claimed&&S.claimed.length) parts.push(T("giftHave").replace("{n}",S.claimed.map(tierName).join(LANG==="en"?", ":"、")));
  /* 跨档只发最高档：更低档已达成但不另发 */
  if(o.mode==="claimable"&&o.id!=="xiaoxueseng"&&S.claimed.indexOf("xiaoxueseng")<0)
    parts.push(T("giftReached").replace("{n}",tierName("xiaoxueseng")));
  if(o.mode==="claimable"&&o.id==="gbti"&&S.claimed.indexOf("baizhan")<0)
    parts.push(T("giftReached").replace("{n}",tierName("baizhan")));
  /* 可领取时不再写「本局达成」，避免和卡片「可领取」重复；未达标也不再写「暂无」 */
  return parts.join(T("giftJoin"));
}
function paintCard(){
  var o=offerOf(), card=$("poster"); if(!card)return;
  card.classList.remove("locked","claimed","xiaoxueseng","baizhan","gbti");
  card.classList.add(o.id, o.mode==="locked"?"locked":o.mode==="claimed"?"claimed":"claimable");
  var img=$("bc-img"), src=POSTERS[o.id];
  if(img && src){ img.src=typeof src==="string"?src:(src.src||src); img.alt=fullName(o.id)+" · "+pair(STR.giftName[o.id]); }
  $("bc-title").innerHTML=breakProd(fullName(o.id));
  $("bc-gift").textContent=pair(STR.giftName[o.id]);
  var mark=$("bc-mark");
  mark.hidden=false;
  if(o.mode==="claimed"){ mark.textContent=T("markGot"); mark.disabled=true; mark.setAttribute("aria-label",T("markGot")); }
  else if(o.mode==="locked"){ mark.textContent=T("markLock"); mark.disabled=true; mark.setAttribute("aria-label",T("markLock")); }
  else if(o.mode==="claimable"){ mark.textContent=T("claimShort"); mark.disabled=false; mark.setAttribute("aria-label",T("claimShort")); }
  else { mark.hidden=true; mark.textContent=""; mark.disabled=true; }
  var need=$("bc-need");
  if(o.mode==="locked"){ need.hidden=false; need.innerHTML=nWrap(T("needLock").replace("{n}",o.need)); }
  else { need.hidden=true; need.textContent=""; }
  var act=$("bc-act"); if(act) act.hidden=true;
  /* 页底晋级/继续始终是唯一主按钮；领取叠在海报底，与已领取同框 */
  $("go").classList.remove("line");
  var gl=giftText(); $("giftline").innerHTML=nWrap(gl); $("giftline").style.display="none";
}
